# config.yaml
# 이 파일을 복사해서 config.yaml로 만들고 본인 정보 채워넣으세요.
# config.yaml은 .gitignore에 포함되어 GitHub에 올라가지 않아야 합니다.

# ===== 연구 분야 프로필 =====
# 옵션: data-mining, ml-general, nlp, cv, speech, robotics, database, security, all
research_profile: "data-mining"

# ===== 관심 키워드 =====
keywords:
  - "data quality"
  - "data curation"
  - "retrieval augmented generation"
  - "RAG"
  - "graph neural network"
  - "recommender system"
  - "time series"
  - "LLM agent"

# ===== arXiv 카테고리 (수동 override) =====
# research_profile에서 자동 매핑되니까 보통 비워두세요
arxiv_categories: []

# ===== 일일 수집량 =====
max_papers_per_day: 200
top_n_in_newsletter: 10

# ===== LLM (요약 생성용) =====
# Google Gemini 권장 — 무료, 한국 카드 등록 불필요
# https://aistudio.google.com/apikey 에서 키 발급
# 환경변수 GOOGLE_API_KEY 로 설정 (GitHub Actions에서 권장)
llm:
  provider: "google"          # "google" 또는 "anthropic"
  model: "gemini-2.5-flash"   # 빠르고 무료 (일 1500회). Anthropic이면 "claude-haiku-4-5-20251001"

# ===== 이메일 발송 =====
email:
  enabled: true
  sender: "your-email@gmail.com"
  recipient: "your-email@gmail.com"
  smtp_host: "smtp.gmail.com"
  smtp_port: 587
  # Gmail 앱 비밀번호 필요. 환경변수 EMAIL_PASSWORD 로 설정

# ===== 대시보드 출력 =====
output_dir: "dashboard"