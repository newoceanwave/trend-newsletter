<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>대시보드 — AI 트렌드 뉴스레터</title>
  <style id="shared-css"></style>
  <style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Segoe UI', sans-serif;
  background: #f9fafb;
  color: #191f28;
  -webkit-font-smoothing: antialiased;
}
.container { max-width: 720px; margin: 0 auto; padding: 32px 20px 80px; }
.page-title {
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: 8px;
}
.page-subtitle {
  font-size: 15px;
  color: #4e5968;
  margin-bottom: 32px;
}
.card {
  background: #fff;
  border: 1px solid #f2f4f6;
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 16px;
}
.card-title {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 8px;
}
.card-text {
  font-size: 14px;
  color: #6b7684;
  line-height: 1.6;
}
.phase-badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 600;
  color: #c08401;
  background: #fff5e0;
  padding: 3px 10px;
  border-radius: 8px;
  margin-bottom: 12px;
}
.next-link {
  color: #3182f6;
  text-decoration: none;
  font-weight: 600;
  font-size: 14px;
}
.next-link:hover { text-decoration: underline; }
.loading { padding: 40px; text-align: center; color: #8b95a1; }
</style>
</head>
<body>
  <div id="header"></div>

  <div class="container" id="main" style="display:none">
    <h1 class="page-title">대시보드</h1>
    <p class="page-subtitle">매일 아침, 내 키워드에 맞는 논문을 여기서 확인하세요</p>

    <div class="card">
      <div class="phase-badge">Phase 2 완료</div>
      <div class="card-title">멀티유저 로그인이 작동합니다 ✅</div>
      <div class="card-text">
        구글 로그인이 연결되었고, 이 페이지는 로그인한 사용자만 볼 수 있어요.
        상단 메뉴로 다른 페이지도 이동할 수 있습니다.
      </div>
    </div>

    <div class="card">
      <div class="card-title">다음 단계</div>
      <div class="card-text">
        Phase 3에서 <strong>설정 페이지</strong>에 키워드와 연구 분야를 등록하면,
        여기 대시보드에 매일 맞춤 논문이 표시됩니다.<br><br>
        <a href="settings.html" class="next-link">설정 페이지로 이동 →</a>
      </div>
    </div>

    <div class="card">
      <div class="card-title">내 계정 정보</div>
      <div class="card-text" id="account-info">불러오는 중...</div>
    </div>
  </div>

  <div class="loading" id="loading">로그인 확인 중...</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="shared.js"></script>
  <script>
  (async function() {
    // 공통 헤더 CSS 주입
    document.getElementById('shared-css').textContent = SHARED_HEADER_CSS;

    // 로그인 필수 — 안 됐으면 index로 튕김
    const session = await requireAuth();
    if (!session) return;

    // 헤더 렌더링
    await renderHeader('header', 'dashboard');

    // 계정 정보 표시
    const user = session.user;
    document.getElementById('account-info').innerHTML =
      '<strong>이메일:</strong> ' + escapeHtml(user.email || '(없음)') + '<br>' +
      '<strong>이름:</strong> ' + escapeHtml(user.user_metadata.full_name || '(없음)') + '<br>' +
      '<strong>유저 ID:</strong> ' + escapeHtml(user.id);

    // 화면 표시
    document.getElementById('loading').style.display = 'none';
    document.getElementById('main').style.display = 'block';
  })();
  </script>
</body>
</html>
