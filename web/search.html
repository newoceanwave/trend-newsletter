<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>논문 검색 — AI 트렌드 뉴스레터</title>
  <style id="shared-css"></style>
  <style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Segoe UI', sans-serif;
  background: #f9fafb;
  color: #191f28;
  -webkit-font-smoothing: antialiased;
}
.container { max-width: 760px; margin: 0 auto; padding: 32px 20px 80px; }
.page-title { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 8px; }
.page-subtitle { font-size: 15px; color: #4e5968; margin-bottom: 28px; }

.search-box {
  background: #fff; border: 1px solid #f2f4f6; border-radius: 16px;
  padding: 20px 24px; margin-bottom: 20px;
}
.search-row { display: flex; gap: 8px; margin-bottom: 14px; }
.search-input {
  flex: 1; height: 44px; padding: 0 16px; border: 1px solid #e5e8eb;
  border-radius: 10px; font-size: 15px; font-family: inherit; color: #191f28;
  outline: none; transition: border-color 0.15s ease;
}
.search-input:focus { border-color: #3182f6; }
.search-btn {
  height: 44px; padding: 0 24px; background: #3182f6; color: #fff; border: none;
  border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer;
}
.search-btn:hover { background: #2872dc; }
.search-btn:disabled { background: #d1d6db; cursor: not-allowed; }

.source-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.source-label { font-size: 12px; color: #8b95a1; font-weight: 500; }
.source-chip {
  padding: 5px 12px; background: #f2f4f6; color: #4e5968;
  border-radius: 16px; font-size: 12px; font-weight: 500; cursor: pointer;
  border: 1px solid transparent; user-select: none; transition: all 0.15s ease;
}
.source-chip.active { background: #e8f3ff; color: #3182f6; border-color: #c4dcff; }
.source-chip:hover { border-color: #c4dcff; }

.tip {
  font-size: 12px; color: #8b95a1; background: #f9fafb; border: 1px solid #f2f4f6;
  border-radius: 10px; padding: 10px 14px; margin-bottom: 16px;
}
.status-bar { font-size: 13px; color: #8b95a1; margin-bottom: 16px; padding: 0 4px; min-height: 20px; }

.result-group { margin-bottom: 32px; }
.result-group-title {
  font-size: 14px; font-weight: 600; color: #4e5968; margin-bottom: 14px;
  display: flex; align-items: center; gap: 8px;
}
.result-group-title .count {
  background: #f2f4f6; color: #6b7684; padding: 2px 8px;
  border-radius: 10px; font-size: 12px; font-weight: 500;
}
.source-badge { font-size: 11px; padding: 2px 8px; border-radius: 6px; font-weight: 600; }
.source-badge.arxiv { background: #fef3e6; color: #c2691a; }
.source-badge.s2 { background: #e8f0fe; color: #1a56c2; }
.source-badge.openalex { background: #eef6ec; color: #2a7d2e; }

.paper-card {
  background: #fff; border: 1px solid #f2f4f6; border-radius: 16px;
  padding: 18px 22px; margin-bottom: 12px; transition: border-color 0.15s ease;
}
.paper-card:hover { border-color: #d1d6db; }
.paper-title {
  font-size: 16px; font-weight: 600; color: #191f28; margin-bottom: 6px;
  letter-spacing: -0.01em; line-height: 1.4;
}
.paper-title a { color: inherit; text-decoration: none; }
.paper-title a:hover { color: #3182f6; }
.paper-meta-line { font-size: 12px; color: #8b95a1; margin-bottom: 8px; }
.paper-abstract { font-size: 13px; color: #4e5968; line-height: 1.6; margin-bottom: 10px; }
.paper-foot { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.paper-foot a { color: #6b7684; text-decoration: none; font-size: 12px; font-weight: 500; }
.paper-foot a:hover { color: #3182f6; }
.cite-count {
  font-size: 11px; color: #8b95a1; background: #f9fafb;
  padding: 2px 8px; border-radius: 6px; border: 1px solid #f2f4f6;
}
.bookmark-btn {
  font-size: 12px; padding: 5px 12px; border-radius: 8px;
  border: 1px solid #d1d6db; background: #fff; color: #4e5968;
  cursor: pointer; font-weight: 500; font-family: inherit;
  margin-left: auto;
}
.bookmark-btn:hover { background: #f9fafb; }
.bookmark-btn.marked {
  background: #e8f3ff; color: #3182f6; border-color: #c4dcff;
}
.bookmark-btn:disabled { opacity: 0.5; cursor: wait; }

.empty, .loading {
  background: #fff; border: 1px solid #f2f4f6; border-radius: 16px;
  padding: 40px 24px; text-align: center; color: #8b95a1; font-size: 14px;
}
.spinner {
  display: inline-block; width: 16px; height: 16px; border: 2px solid #e5e8eb;
  border-top-color: #3182f6; border-radius: 50%; animation: spin 0.7s linear infinite;
  vertical-align: middle; margin-right: 8px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: #191f28; color: #fff; padding: 12px 20px; border-radius: 10px;
  font-size: 13px; opacity: 0; transition: opacity 0.2s ease;
  pointer-events: none; z-index: 200;
}
.toast.show { opacity: 1; }
.toast.error { background: #c0392b; }

.page-loading { padding: 40px; text-align: center; color: #8b95a1; }
</style>
</head>
<body>
  <div id="header"></div>

  <div class="container" id="main" style="display:none">
    <h1 class="page-title">논문 검색</h1>
    <p class="page-subtitle">arXiv · Semantic Scholar · OpenAlex에서 키워드로 논문 검색</p>

    <div class="search-box">
      <div class="search-row">
        <input type="text" class="search-input" id="search-input"
               placeholder="키워드 입력 (예: graph neural network)" />
        <button class="search-btn" id="search-btn">검색</button>
      </div>
      <div class="source-row">
        <span class="source-label">검색 소스:</span>
        <span class="source-chip active" data-source="arxiv">arXiv</span>
        <span class="source-chip active" data-source="s2">Semantic Scholar</span>
        <span class="source-chip active" data-source="openalex">OpenAlex</span>
      </div>
    </div>

    <div class="tip">
      💡 영어 abstract는 크롬에서 우클릭 → "한국어로 번역"으로 빠르게 볼 수 있어요. 논문을 북마크하면 마이페이지에 저장됩니다.
    </div>

    <div class="status-bar" id="status-bar"></div>
    <div id="results"></div>
  </div>

  <div class="page-loading" id="loading">로그인 확인 중...</div>
  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="shared.js"></script>
  <script>
  (async function() {
    document.getElementById('shared-css').textContent = SHARED_HEADER_CSS;
    const session = await requireAuth();
    if (!session) return;
    await renderHeader('header', 'search');

    const userId = session.user.id;
    const toastEl = document.getElementById('toast');
    function toast(msg, isError) {
      toastEl.textContent = msg;
      toastEl.className = 'toast show' + (isError ? ' error' : '');
      setTimeout(() => { toastEl.className = 'toast'; }, 2500);
    }

    // 내 북마크 ID 목록 (검색 결과에서 이미 북마크된 거 표시용)
    let bookmarkedIds = await fetchMyBookmarkIds();

    let activeSources = new Set(['arxiv', 's2', 'openalex']);

    document.querySelectorAll('.source-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const src = chip.dataset.source;
        if (activeSources.has(src)) {
          if (activeSources.size > 1) {
            activeSources.delete(src);
            chip.classList.remove('active');
          }
        } else {
          activeSources.add(src);
          chip.classList.add('active');
        }
      });
    });

    async function doSearch() {
      const query = document.getElementById('search-input').value.trim();
      if (!query) return;

      const btn = document.getElementById('search-btn');
      const statusBar = document.getElementById('status-bar');
      const resultsEl = document.getElementById('results');

      btn.disabled = true;
      btn.textContent = '검색 중...';
      resultsEl.innerHTML = '';
      statusBar.innerHTML = '<span class="spinner"></span>' + activeSources.size + '개 소스에서 검색 중...';

      const tasks = [];
      if (activeSources.has('arxiv')) tasks.push(searchArxiv(query));
      if (activeSources.has('s2')) tasks.push(searchS2(query));
      if (activeSources.has('openalex')) tasks.push(searchOpenAlex(query));

      const results = await Promise.allSettled(tasks);

      let totalCount = 0;
      resultsEl.innerHTML = '';
      results.forEach(r => {
        if (r.status === 'fulfilled' && r.value) {
          renderGroup(resultsEl, r.value.source, r.value.label, r.value.papers);
          totalCount += r.value.papers.length;
        } else if (r.status === 'rejected') {
          console.error('Search failed:', r.reason);
        }
      });

      if (totalCount === 0) {
        resultsEl.innerHTML = '<div class="empty">검색 결과가 없어요. 다른 키워드를 시도해보세요.</div>';
      }
      statusBar.textContent = '총 ' + totalCount + '편 검색됨';

      btn.disabled = false;
      btn.textContent = '검색';
    }

    async function searchArxiv(query) {
      const url = 'https://export.arxiv.org/api/query?search_query=all:'
        + encodeURIComponent(query) + '&start=0&max_results=10&sortBy=relevance';
      const resp = await fetch(url);
      const text = await resp.text();
      const xml = new DOMParser().parseFromString(text, 'text/xml');
      const entries = xml.querySelectorAll('entry');
      const papers = [];
      entries.forEach(e => {
        const title = (e.querySelector('title')?.textContent || '').trim();
        const abstract = (e.querySelector('summary')?.textContent || '').trim();
        const link = e.querySelector('id')?.textContent || '#';
        const published = (e.querySelector('published')?.textContent || '').slice(0, 10);
        const authors = Array.from(e.querySelectorAll('author name'))
          .slice(0, 3).map(a => a.textContent).join(', ');
        papers.push({
          paper_id: 'arxiv:' + link.split('/').pop(),
          title, abstract, link, published, authors, citations: null
        });
      });
      return { source: 'arxiv', label: 'arXiv', papers };
    }

    async function searchS2(query) {
      const url = 'https://api.semanticscholar.org/graph/v1/paper/search?query='
        + encodeURIComponent(query)
        + '&limit=10&fields=title,abstract,url,year,authors,citationCount,paperId';
      const resp = await fetch(url);
      if (!resp.ok) throw new Error('S2 ' + resp.status);
      const data = await resp.json();
      const papers = (data.data || []).map(p => ({
        paper_id: 's2:' + (p.paperId || p.url),
        title: p.title || '',
        abstract: p.abstract || '(abstract 없음)',
        link: p.url || '#',
        published: p.year ? String(p.year) : '',
        authors: (p.authors || []).slice(0, 3).map(a => a.name).join(', '),
        citations: p.citationCount,
      }));
      return { source: 's2', label: 'Semantic Scholar', papers };
    }

    async function searchOpenAlex(query) {
      const url = 'https://api.openalex.org/works?search='
        + encodeURIComponent(query) + '&per-page=10';
      const resp = await fetch(url);
      if (!resp.ok) throw new Error('OpenAlex ' + resp.status);
      const data = await resp.json();
      const papers = (data.results || []).map(p => {
        let abstract = '(abstract 없음)';
        if (p.abstract_inverted_index) {
          const positions = [];
          for (const [word, idxs] of Object.entries(p.abstract_inverted_index)) {
            idxs.forEach(i => positions.push([i, word]));
          }
          positions.sort((a, b) => a[0] - b[0]);
          abstract = positions.map(x => x[1]).join(' ');
        }
        return {
          paper_id: 'openalex:' + (p.id || '').split('/').pop(),
          title: p.title || '',
          abstract: abstract,
          link: p.doi ? ('https://doi.org/' + p.doi.replace('https://doi.org/', '')) : (p.id || '#'),
          published: p.publication_year ? String(p.publication_year) : '',
          authors: (p.authorships || []).slice(0, 3).map(a => a.author?.display_name).filter(Boolean).join(', '),
          citations: p.cited_by_count,
        };
      });
      return { source: 'openalex', label: 'OpenAlex', papers };
    }

    function renderGroup(container, source, label, papers) {
      const group = document.createElement('div');
      group.className = 'result-group';

      if (!papers.length) {
        group.innerHTML = '<div class="result-group-title">' +
          '<span class="source-badge ' + source + '">' + label + '</span>' +
          '<span class="count">0</span></div>' +
          '<div class="empty">결과 없음</div>';
        container.appendChild(group);
        return;
      }

      group.innerHTML = '<div class="result-group-title">' +
        '<span class="source-badge ' + source + '">' + label + '</span>' +
        '<span class="count">' + papers.length + '</span></div>';

      papers.forEach(p => {
        const card = document.createElement('div');
        card.className = 'paper-card';
        const citeStr = (p.citations != null)
          ? '<span class="cite-count">인용 ' + p.citations + '</span>' : '';
        const metaLine = [p.authors, p.published].filter(Boolean).join(' · ');
        const isMarked = bookmarkedIds.has(p.paper_id);

        card.innerHTML =
          '<div class="paper-title"><a href="' + p.link + '" target="_blank">' +
            escapeHtml(p.title) + '</a></div>' +
          (metaLine ? '<div class="paper-meta-line">' + escapeHtml(metaLine) + '</div>' : '') +
          '<div class="paper-abstract">' + escapeHtml(p.abstract) + '</div>' +
          '<div class="paper-foot">' +
            '<a href="' + p.link + '" target="_blank">원문 보기</a>' +
            citeStr +
            '<button class="bookmark-btn' + (isMarked ? ' marked' : '') + '">' +
              (isMarked ? '★ 북마크됨' : '☆ 북마크') +
            '</button>' +
          '</div>';

        const bmBtn = card.querySelector('.bookmark-btn');
        bmBtn.addEventListener('click', async () => {
          bmBtn.disabled = true;
          const currentlyMarked = bookmarkedIds.has(p.paper_id);
          try {
            if (currentlyMarked) {
              await deleteBookmarkByPaperId(userId, p.paper_id);
              bookmarkedIds.delete(p.paper_id);
              bmBtn.className = 'bookmark-btn';
              bmBtn.textContent = '☆ 북마크';
              toast('북마크 해제됨');
            } else {
              await addBookmark(userId, {
                paper_id: p.paper_id,
                title: p.title,
                abstract: p.abstract,
                arxiv_url: p.link,
                summary_ko: '',
              });
              bookmarkedIds.add(p.paper_id);
              bmBtn.className = 'bookmark-btn marked';
              bmBtn.textContent = '★ 북마크됨';
              toast('북마크에 저장됨');
            }
          } catch (e) {
            toast(e.message, true);
          } finally {
            bmBtn.disabled = false;
          }
        });

        group.appendChild(card);
      });

      container.appendChild(group);
    }

    document.getElementById('search-btn').addEventListener('click', doSearch);
    document.getElementById('search-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') doSearch();
    });

    // ?q= 파라미터 자동 검색
    const params = new URLSearchParams(window.location.search);
    const initialQuery = params.get('q');
    if (initialQuery) {
      document.getElementById('search-input').value = initialQuery;
    }

    document.getElementById('loading').style.display = 'none';
    document.getElementById('main').style.display = 'block';

    if (initialQuery) doSearch();
  })();
  </script>
</body>
</html>
