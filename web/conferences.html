<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학회 — AI 트렌드 뉴스레터</title>
  <style id="shared-css"></style>
  <style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Segoe UI', sans-serif;
  background: #f9fafb; color: #191f28; -webkit-font-smoothing: antialiased;
}
.container { max-width: 760px; margin: 0 auto; padding: 32px 20px 80px; }
.page-title { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 8px; }
.page-subtitle { font-size: 15px; color: #4e5968; margin-bottom: 8px; }
.run-date { font-size: 13px; color: #8b95a1; margin-bottom: 20px; }

.info-box {
  font-size: 12px; color: #8b95a1; background: #f9fafb;
  border: 1px solid #f2f4f6; border-radius: 10px;
  padding: 10px 14px; margin-bottom: 20px; line-height: 1.6;
}

.venue-filter { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
.vf-chip {
  padding: 6px 12px; background: #f2f4f6; color: #4e5968;
  border-radius: 16px; font-size: 12px; font-weight: 500; cursor: pointer;
  border: 1px solid transparent; user-select: none; transition: all 0.15s ease;
}
.vf-chip.active { background: #e8f3ff; color: #3182f6; border-color: #c4dcff; }
.vf-chip:hover { border-color: #c4dcff; }

.status-bar { font-size: 13px; color: #8b95a1; margin-bottom: 16px; min-height: 20px; }

.venue-block {
  background: #fff; border: 1px solid #f2f4f6; border-radius: 16px;
  padding: 22px 24px; margin-bottom: 16px;
}
.venue-head {
  display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px;
}
.venue-name { font-size: 18px; font-weight: 700; }
.venue-cnt { font-size: 13px; color: #8b95a1; font-weight: 500; }

.kw-freq-label { font-size: 12px; font-weight: 600; color: #8b95a1; margin-bottom: 8px; }
.kw-freq { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.kw-tag {
  font-size: 12px; padding: 5px 10px; border-radius: 8px;
  background: #f2f4f6; color: #4e5968; font-weight: 500;
  cursor: pointer; transition: all 0.15s ease;
}
.kw-tag:hover { background: #e8f3ff; color: #3182f6; }
.kw-tag .n { color: #b0b8c1; font-weight: 600; margin-left: 4px; }
.kw-tag.rank1 { background: #e8f3ff; color: #3182f6; }
.kw-tag.rank2 { background: #eef6ec; color: #2a7d2e; }

.toggle-titles {
  font-size: 13px; color: #3182f6; cursor: pointer; font-weight: 600;
  user-select: none; display: inline-flex; align-items: center; gap: 4px;
}
.toggle-titles:hover { text-decoration: underline; }

.title-list { margin-top: 14px; display: none; }
.title-list.open { display: block; }
.title-search {
  width: 100%; height: 36px; padding: 0 12px; margin-bottom: 10px;
  border: 1px solid #e5e8eb; border-radius: 8px; font-size: 13px;
  font-family: inherit; outline: none;
}
.title-search:focus { border-color: #3182f6; }
.title-item {
  padding: 10px 0; border-bottom: 1px solid #f7f8fa;
  font-size: 13px; line-height: 1.5;
}
.title-item:last-child { border-bottom: none; }
.title-item a { color: #4e5968; text-decoration: none; }
.title-item a:hover { color: #3182f6; }
.title-item .au { color: #b0b8c1; font-size: 12px; display: block; margin-top: 2px; }

.empty {
  background: #fff; border: 1px solid #f2f4f6; border-radius: 16px;
  padding: 40px 24px; text-align: center; color: #8b95a1;
  font-size: 14px; line-height: 1.7;
}
.empty a { color: #3182f6; text-decoration: none; font-weight: 600; }
.spinner {
  display: inline-block; width: 16px; height: 16px; border: 2px solid #e5e8eb;
  border-top-color: #3182f6; border-radius: 50%; animation: spin 0.7s linear infinite;
  vertical-align: middle; margin-right: 8px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading { padding: 40px; text-align: center; color: #8b95a1; }
</style>
</head>
<body>
  <div id="header"></div>

  <div class="container" id="main" style="display:none">
    <h1 class="page-title">학회</h1>
    <p class="page-subtitle">최근 3개년 주요 학회 — 어떤 주제가 많이 올라왔나로 트렌드 파악</p>
    <div class="run-date" id="run-date"></div>

    <div class="info-box">
      ℹ️ OpenReview에 등록된 학회의 <b>수락 논문 전체</b>입니다. 오랄/포스터 구분 정보는
      OpenReview에 없어 제공하지 않습니다. 학회별로 제목에서 자주 등장한 키워드를 집계해
      트렌드를 보여줍니다.
    </div>

    <div class="venue-filter" id="venue-filter"></div>
    <div class="status-bar" id="status-bar"></div>
    <div id="results"></div>
  </div>

  <div class="loading" id="loading">로그인 확인 중...</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="shared.js"></script>
  <script>
  (async function() {
    document.getElementById('shared-css').textContent = SHARED_HEADER_CSS;
    const session = await requireAuth();
    if (!session) return;
    await renderHeader('header', 'conferences');

    const runDateEl = document.getElementById('run-date');
    const statusBar = document.getElementById('status-bar');
    const resultsEl = document.getElementById('results');
    const venueFilterEl = document.getElementById('venue-filter');

    // 트렌드 분석에서 제외할 흔한 단어
    const STOPWORDS = new Set([
      'the','a','an','of','for','and','or','to','in','on','with','via','using','from',
      'is','are','be','at','by','as','that','this','we','our','it','its','their',
      'towards','toward','based','approach','method','methods','model','models',
      'learning','network','networks','neural','deep','via','can','new','novel',
      'efficient','effective','robust','improving','improved','improve','study',
      'analysis','framework','generalization','understanding','better','large',
      'scale','data','task','tasks','problem','problems','system','systems'
    ]);

    function topKeywords(papers, topN) {
      const freq = {};
      papers.forEach(p => {
        const words = (p.title || '').toLowerCase()
          .replace(/[^a-z0-9\s\-]/g, ' ')
          .split(/\s+/)
          .filter(w => w.length >= 3 && !STOPWORDS.has(w) && !/^\d+$/.test(w));
        // 중복 단어는 논문당 1회만
        const uniq = new Set(words);
        uniq.forEach(w => { freq[w] = (freq[w] || 0) + 1; });
      });
      return Object.entries(freq)
        .sort((a, b) => b[1] - a[1])
        .slice(0, topN || 15)
        .filter(x => x[1] >= 2);
    }

    // 최근 학회 데이터 날짜
    const confDate = await fetchLatestConferenceDate();
    if (!confDate) {
      runDateEl.textContent = '';
      resultsEl.innerHTML =
        '<div class="empty">아직 학회 데이터가 없어요.<br>' +
        '매일 배치가 OpenReview에서 수집합니다. 배치 실행 후 표시됩니다.</div>';
      document.getElementById('loading').style.display = 'none';
      document.getElementById('main').style.display = 'block';
      return;
    }
    runDateEl.textContent = confDate + ' 수집 기준';

    // 전체 학회 데이터 가져오기 (venue별로 그룹)
    statusBar.innerHTML = '<span class="spinner"></span>학회 논문 불러오는 중...';

    // shared.js의 venue 목록 사용 — 전 분야 합집합
    const ALL_FIELD_IDS = Object.keys(FIELD_VENUES);
    const allVenues = getVenuesForFields(ALL_FIELD_IDS);

    const venueData = {};  // venue → papers[]
    const tasks = allVenues.map(v =>
      fetchVenueePapers(v, 2000).then(papers => { venueData[v] = papers; })
    );
    await Promise.allSettled(tasks);

    // 데이터 있는 venue만, 논문 수 많은 순
    const venuesWithData = Object.keys(venueData)
      .filter(v => venueData[v] && venueData[v].length > 0)
      .sort((a, b) => venueData[b].length - venueData[a].length);

    if (venuesWithData.length === 0) {
      statusBar.textContent = '';
      resultsEl.innerHTML =
        '<div class="empty">학회 논문을 찾지 못했어요.<br>' +
        'OpenReview에서 아직 수집되지 않았을 수 있어요.</div>';
      document.getElementById('loading').style.display = 'none';
      document.getElementById('main').style.display = 'block';
      return;
    }

    statusBar.textContent = venuesWithData.length + '개 학회 · 총 ' +
      venuesWithData.reduce((s, v) => s + venueData[v].length, 0) + '편';

    // venue 필터 칩 (기본 전체)
    let activeVenues = new Set(venuesWithData);
    function renderFilter() {
      venueFilterEl.innerHTML = '';
      venuesWithData.forEach(v => {
        const chip = document.createElement('span');
        chip.className = 'vf-chip' + (activeVenues.has(v) ? ' active' : '');
        chip.textContent = v + ' (' + venueData[v].length + ')';
        chip.addEventListener('click', () => {
          if (activeVenues.has(v)) {
            if (activeVenues.size > 1) activeVenues.delete(v);
          } else {
            activeVenues.add(v);
          }
          renderFilter();
          renderVenues();
        });
        venueFilterEl.appendChild(chip);
      });
    }

    function renderVenues() {
      resultsEl.innerHTML = '';
      venuesWithData.filter(v => activeVenues.has(v)).forEach(venue => {
        const papers = venueData[venue];
        const block = document.createElement('div');
        block.className = 'venue-block';

        const kws = topKeywords(papers, 15);
        const kwHtml = kws.map((kw, i) => {
          const cls = i === 0 ? ' rank1' : (i < 3 ? ' rank2' : '');
          return '<span class="kw-tag' + cls + '" data-kw="' + escapeHtml(kw[0]) + '">' +
            escapeHtml(kw[0]) + '<span class="n">' + kw[1] + '</span></span>';
        }).join('');

        block.innerHTML =
          '<div class="venue-head">' +
            '<span class="venue-name">' + escapeHtml(venue) + '</span>' +
            '<span class="venue-cnt">' + papers.length + '편</span>' +
          '</div>' +
          '<div class="kw-freq-label">제목에서 자주 등장한 키워드</div>' +
          '<div class="kw-freq">' + (kwHtml || '<span class="venue-cnt">집계할 키워드 부족</span>') + '</div>' +
          '<span class="toggle-titles">▾ 논문 제목 전체 보기 (' + papers.length + '편)</span>' +
          '<div class="title-list">' +
            '<input type="text" class="title-search" placeholder="제목 내 검색...">' +
            '<div class="title-items"></div>' +
          '</div>';

        const toggle = block.querySelector('.toggle-titles');
        const titleList = block.querySelector('.title-list');
        const titleItems = block.querySelector('.title-items');
        const titleSearch = block.querySelector('.title-search');

        function renderTitles(filterText) {
          const ft = (filterText || '').toLowerCase();
          const shown = papers.filter(p =>
            !ft || (p.title || '').toLowerCase().includes(ft));
          titleItems.innerHTML = shown.slice(0, 500).map(p =>
            '<div class="title-item">' +
              '<a href="' + p.url + '" target="_blank">' + escapeHtml(p.title) + '</a>' +
              (p.authors ? '<span class="au">' + escapeHtml(p.authors) + '</span>' : '') +
            '</div>'
          ).join('') || '<div class="title-item">검색 결과 없음</div>';
        }

        let opened = false;
        toggle.addEventListener('click', () => {
          opened = !opened;
          titleList.classList.toggle('open', opened);
          toggle.textContent = (opened ? '▴ 접기' : '▾ 논문 제목 전체 보기 (' + papers.length + '편)');
          if (opened && titleItems.children.length === 0) renderTitles('');
        });
        titleSearch.addEventListener('input', () => renderTitles(titleSearch.value.trim()));

        // 키워드 태그 클릭 → 그 키워드로 제목 목록 펼치고 필터
        block.querySelectorAll('.kw-tag').forEach(tag => {
          tag.addEventListener('click', () => {
            const kw = tag.dataset.kw;
            if (!opened) {
              opened = true;
              titleList.classList.add('open');
              toggle.textContent = '▴ 접기';
            }
            titleSearch.value = kw;
            renderTitles(kw);
            titleList.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          });
        });

        resultsEl.appendChild(block);
      });
    }

    renderFilter();
    renderVenues();

    document.getElementById('loading').style.display = 'none';
    document.getElementById('main').style.display = 'block';
  })();
  </script>
</body>
</html>
