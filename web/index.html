<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 트렌드 뉴스레터</title>
  <style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Segoe UI', sans-serif;
  background: #f9fafb;
  color: #191f28;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.landing {
  max-width: 480px;
  width: 100%;
  text-align: center;
}
.logo-emoji { font-size: 48px; margin-bottom: 16px; }
.landing-title {
  font-size: 32px;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: 12px;
}
.landing-subtitle {
  font-size: 16px;
  color: #4e5968;
  line-height: 1.6;
  margin-bottom: 32px;
}
.feature-list {
  background: #fff;
  border: 1px solid #f2f4f6;
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 24px;
  text-align: left;
}
.feature-item {
  display: flex;
  gap: 12px;
  padding: 10px 0;
  font-size: 14px;
  color: #4e5968;
}
.feature-item:not(:last-child) { border-bottom: 1px solid #f9fafb; }
.feature-icon { font-size: 18px; flex-shrink: 0; }
.google-btn {
  width: 100%;
  height: 52px;
  background: #fff;
  border: 1px solid #d1d6db;
  border-radius: 14px;
  font-size: 15px;
  font-weight: 600;
  color: #191f28;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  transition: all 0.15s ease;
}
.google-btn:hover { background: #f9fafb; border-color: #b0b8c1; }
.google-icon {
  width: 20px; height: 20px;
}
.loading {
  font-size: 14px;
  color: #8b95a1;
  padding: 20px;
}
.footer-note {
  margin-top: 20px;
  font-size: 12px;
  color: #b0b8c1;
}
</style>
</head>
<body>
  <div class="landing">
    <div class="logo-emoji">📰</div>
    <h1 class="landing-title">AI 트렌드 뉴스레터</h1>
    <p class="landing-subtitle">
      매일 arXiv와 Hugging Face에서<br>
      내 키워드에 맞는 논문을 골라 한국어 요약으로
    </p>

    <div id="auth-area">
      <div class="loading">로그인 상태 확인 중...</div>
    </div>

    <div class="feature-list" id="feature-list" style="display:none">
      <div class="feature-item">
        <span class="feature-icon">🔍</span>
        <span>내 연구 키워드를 등록하면 매일 맞춤 논문 추천</span>
      </div>
      <div class="feature-item">
        <span class="feature-icon">🎓</span>
        <span>연구 분야별 트렌드 — 키워드 없이도 분야 소식</span>
      </div>
      <div class="feature-item">
        <span class="feature-icon">📌</span>
        <span>관심 논문 북마크 — 마이페이지에 저장</span>
      </div>
      <div class="feature-item">
        <span class="feature-icon">📧</span>
        <span>매일 아침 이메일로 추천 논문 받기</span>
      </div>
    </div>

    <div class="footer-note" id="footer-note" style="display:none">
      구글 계정으로 간편하게 시작하세요
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="shared.js"></script>
  <script>
  (async function() {
    const authArea = document.getElementById('auth-area');
    const featureList = document.getElementById('feature-list');
    const footerNote = document.getElementById('footer-note');

    const session = await getSession();

    if (session) {
      // 이미 로그인됨 → 대시보드로
      authArea.innerHTML = '<div class="loading">대시보드로 이동 중...</div>';
      window.location.href = 'dashboard.html';
      return;
    }

    // 로그인 안 됨 → 로그인 버튼 표시
    authArea.innerHTML =
      '<button class="google-btn" id="login-btn">' +
        '<svg class="google-icon" viewBox="0 0 24 24">' +
          '<path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>' +
          '<path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>' +
          '<path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>' +
          '<path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>' +
        '</svg>' +
        '구글로 시작하기' +
      '</button>';

    featureList.style.display = 'block';
    footerNote.style.display = 'block';

    document.getElementById('login-btn').addEventListener('click', () => {
      loginWithGoogle('dashboard.html');
    });
  })();
  </script>
</body>
</html>
