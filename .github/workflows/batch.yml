name: Multi-user Daily Batch

on:
  schedule:
    # 매일 0시 UTC = 한국 시간 오전 9시
    - cron: '0 0 * * *'
  workflow_dispatch:  # 수동 실행 버튼

jobs:
  batch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install requests

      - name: Run multi-user batch
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python batch.py

      - name: Commit translation cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add translations.json || true
          git diff --staged --quiet || git commit -m "Update translation cache $(date +%Y-%m-%d)"
          git pull --rebase origin main || true
          git push || true